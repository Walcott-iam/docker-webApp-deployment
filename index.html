<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker & Containerization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: #1a1a2e;
            color: #f0f0f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .container {
            background-color: #16213e;
            border-radius: 12px;
            padding: 3rem;
            max-width: 800px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid #0f3460;
        }
        h1 {
            color: #e94560;
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        p {
            font-size: 1.2rem;
            line-height: 1.7;
            color: #d4d4d4;
            text-align: center;
        }
        .highlight {
            color: #fca311;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Docker & Containerization</h1>
        <p>This web application is running inside a Docker container for the <span class="highlight">Codomax Internship.</span></p>
    </div>
</body>
</html>
